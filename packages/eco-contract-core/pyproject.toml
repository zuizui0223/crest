[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-contract-core"
version = "0.1.0"
description = "Neutral finite-state contracts shared across CREST companion methods"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "zuizui0223"}]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
