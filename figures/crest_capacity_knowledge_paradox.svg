<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="white"/>
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#111}
    .label{font:600 20px Arial,sans-serif;fill:#111}
    .text{font:17px Arial,sans-serif;fill:#222}
    .small{font:15px Arial,sans-serif;fill:#333}
    .box{fill:#f7f7f7;stroke:#222;stroke-width:2;rx:14}
    .world{fill:#eef4ff;stroke:#294c7a;stroke-width:2;rx:14}
    .action{fill:#fff3dd;stroke:#8a5b13;stroke-width:2;rx:12}
    .out{fill:#edf8ee;stroke:#2f6b3b;stroke-width:2;rx:12}
    .arrow{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#666;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="40" y="45" class="title">Figure 1. Conservation capacity can outgrow conservation knowledge</text>

  <text x="45" y="92" class="label">A. Ecology-grounded state split</text>
  <rect x="45" y="118" width="240" height="92" class="world"/>
  <text x="165" y="151" text-anchor="middle" class="label">Sediment legacy</text>
  <text x="165" y="178" text-anchor="middle" class="text">current output: turbid</text>
  <text x="165" y="200" text-anchor="middle" class="small">internal-P dominated</text>

  <rect x="45" y="252" width="240" height="92" class="world"/>
  <text x="165" y="285" text-anchor="middle" class="label">Food-web feedback</text>
  <text x="165" y="312" text-anchor="middle" class="text">current output: turbid</text>
  <text x="165" y="334" text-anchor="middle" class="small">fish/macrophyte dominated</text>

  <rect x="340" y="170" width="220" height="120" class="box"/>
  <text x="450" y="203" text-anchor="middle" class="label">Restricted task</text>
  <text x="450" y="232" text-anchor="middle" class="text">“currently turbid?”</text>
  <text x="450" y="262" text-anchor="middle" class="text">one coarse state</text>
  <path d="M285 164 C310 164,320 194,340 210" class="arrow"/>
  <path d="M285 298 C310 298,320 270,340 250" class="arrow"/>

  <rect x="625" y="105" width="220" height="82" class="action"/>
  <text x="735" y="138" text-anchor="middle" class="label">New action</text>
  <text x="735" y="165" text-anchor="middle" class="text">sediment treatment</text>
  <rect x="625" y="221" width="220" height="82" class="action"/>
  <text x="735" y="254" text-anchor="middle" class="label">New action</text>
  <text x="735" y="281" text-anchor="middle" class="text">food-web restoration</text>

  <path d="M560 205 C590 185,600 160,625 150" class="arrow"/>
  <path d="M560 250 C590 260,600 265,625 265" class="arrow"/>

  <rect x="905" y="105" width="235" height="82" class="out"/>
  <text x="1022" y="138" text-anchor="middle" class="label">State S</text>
  <text x="1022" y="165" text-anchor="middle" class="text">sediment response class</text>
  <rect x="905" y="221" width="235" height="82" class="out"/>
  <text x="1022" y="254" text-anchor="middle" class="label">State F</text>
  <text x="1022" y="281" text-anchor="middle" class="text">food-web response class</text>
  <path d="M845 146 L905 146" class="arrow"/>
  <path d="M845 262 L905 262" class="arrow"/>

  <text x="45" y="402" class="label">B. Finite capability–resolution theorem</text>
  <rect x="45" y="432" width="250" height="100" class="box"/>
  <text x="170" y="466" text-anchor="middle" class="label">Before</text>
  <text x="170" y="494" text-anchor="middle" class="text">actions = {hold}</text>
  <text x="170" y="520" text-anchor="middle" class="text">present slice: 1 state</text>

  <rect x="365" y="432" width="250" height="100" class="action"/>
  <text x="490" y="466" text-anchor="middle" class="label">Add one action</text>
  <text x="490" y="496" text-anchor="middle" class="text">probe</text>
  <text x="490" y="520" text-anchor="middle" class="small">fixed action/output alphabet</text>
  <path d="M295 482 L365 482" class="arrow"/>

  <rect x="685" y="420" width="250" height="124" class="box"/>
  <text x="810" y="453" text-anchor="middle" class="label">After</text>
  <text x="810" y="481" text-anchor="middle" class="text">present slice: 2^m states</text>
  <text x="810" y="507" text-anchor="middle" class="text">resolution debt: m bits</text>
  <text x="810" y="531" text-anchor="middle" class="small">full-state ID: yes → no</text>
  <path d="M615 482 L685 482" class="arrow"/>

  <rect x="985" y="420" width="170" height="124" class="out"/>
  <text x="1070" y="453" text-anchor="middle" class="label">Carrier</text>
  <text x="1070" y="487" text-anchor="middle" class="text">Δ|K*| = 1</text>
  <text x="1070" y="517" text-anchor="middle" class="small">coarse target</text>
  <text x="1070" y="538" text-anchor="middle" class="small">still reportable</text>
  <path d="M935 482 L985 482" class="arrow"/>

  <path d="M170 590 C410 660,790 660,1070 590" class="dash"/>
  <text x="615" y="665" text-anchor="middle" class="label">small capability gain does not bound representational burden</text>
</svg>
