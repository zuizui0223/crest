name: Temporary Table 1 integration

on:
  pull_request:
  push:
    branches:
      - agent/crest-table1-integration

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crest-table1-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate Table 1
        run: python scripts/_tmp_integrate_table1.py
      - name: Verify submission controls
        run: python scripts/verify_crest_philosophy_submission.py --write-report
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/crest_philosophy_biology_philosophy.md artifacts/crest_philosophy_submission_report.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Integrate Table 1 into target manuscript'
            git push origin HEAD:agent/crest-table1-integration
          fi
