name: Reframe canonical manuscript once

on:
  push:
    branches:
      - crest/v07-canonical-pure-theory-framing-2026-09-09
    paths:
      - scripts/reframe_temporal_boundary_once.py
      - .github/workflows/reframe-temporal-boundary-once.yml

permissions:
  contents: write

jobs:
  reframe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crest/v07-canonical-pure-theory-framing-2026-09-09

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact-string temporal-boundary reframing
        run: python scripts/reframe_temporal_boundary_once.py

      - name: Commit generated manuscript and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/crest_flagship_amnat_v0.7_semantic_access.md manuscript/amnat_submission_metadata.json
          git diff --cached --check
          git commit -m "Reframe canonical manuscript as temporal-boundary state theory"
          git push origin HEAD:crest/v07-canonical-pure-theory-framing-2026-09-09
