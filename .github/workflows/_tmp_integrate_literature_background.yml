name: Temporary literature background integration

on:
  push:
    branches:
      - agent/crest-literature-background

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crest-literature-background
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate literature background
        run: python scripts/_tmp_integrate_literature_background.py
      - name: Verify submission controls
        run: python scripts/verify_crest_philosophy_submission.py --write-report
      - name: Commit integrated manuscript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/crest_philosophy_biology_philosophy.md artifacts/crest_philosophy_submission_report.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Integrate audited literature background into target manuscript'
            git push origin HEAD:agent/crest-literature-background
          fi
