name: Temporary structural monitoring debt integration

on:
  pull_request:
  push:
    branches:
      - agent/crest-structural-monitoring-debt

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crest-structural-monitoring-debt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate structural monitoring debt example
        run: python scripts/_tmp_integrate_structural_monitoring_debt.py
      - name: Verify submission controls
        run: python scripts/verify_crest_philosophy_submission.py --write-report
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/crest_philosophy_biology_philosophy.md artifacts/crest_philosophy_submission_report.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Integrate structural monitoring debt example'
            git push origin HEAD:agent/crest-structural-monitoring-debt
          fi
