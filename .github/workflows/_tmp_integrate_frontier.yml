name: Temporary frontier integration

on:
  push:
    branches:
      - agent/crest-frontier-integrate

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crest-frontier-integrate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate frontier language
        run: python scripts/_tmp_integrate_adequacy_frontier.py
      - name: Verify generated manuscript
        run: |
          git diff --check
          python scripts/verify_crest_philosophy_submission.py --write-report
      - name: Commit generated manuscript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/crest_philosophy_biology_philosophy.md artifacts/crest_philosophy_submission_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate adequacy frontier into target manuscript'
            git push origin HEAD:agent/crest-frontier-integrate
          fi
