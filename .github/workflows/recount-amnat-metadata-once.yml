name: Recount AmNat metadata once

on:
  push:
    branches:
      - crest/v07-canonical-pure-theory-framing-2026-09-09
    paths:
      - scripts/recount_amnat_metadata_once.py
      - .github/workflows/recount-amnat-metadata-once.yml

permissions:
  contents: write

jobs:
  recount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crest/v07-canonical-pure-theory-framing-2026-09-09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recount metadata from canonical manuscript
        run: python scripts/recount_amnat_metadata_once.py
      - name: Commit metadata recount
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/amnat_submission_metadata.json
          git diff --cached --check
          git commit -m "Recount AmNat metadata after temporal-boundary reframing"
          git push origin HEAD:crest/v07-canonical-pure-theory-framing-2026-09-09
