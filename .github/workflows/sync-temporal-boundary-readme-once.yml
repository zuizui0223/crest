name: Sync temporal-boundary README once

on:
  push:
    branches:
      - crest/v07-canonical-pure-theory-framing-2026-09-09
    paths:
      - scripts/sync_temporal_boundary_readme_once.py
      - .github/workflows/sync-temporal-boundary-readme-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crest/v07-canonical-pure-theory-framing-2026-09-09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-string README sync
        run: python scripts/sync_temporal_boundary_readme_once.py
      - name: Commit README sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/SUBMISSION_README.md
          git diff --cached --check
          git commit -m "Align submission README with temporal-boundary theory"
          git push origin HEAD:crest/v07-canonical-pure-theory-framing-2026-09-09
